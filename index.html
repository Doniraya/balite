<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Balite</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142823'/%3E%3Cpolygon points='32,8 50,28 32,56 14,28' fill='%23f5b942'/%3E%3Cpolygon points='32,8 50,28 32,33' fill='%23ffe38f'/%3E%3Cpolygon points='32,33 50,28 32,56' fill='%23d49222'/%3E%3Cpolygon points='32,16 40,28 32,46 24,28' fill='none' stroke='%23142823' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0d1d1b;
        color: #f3efe6;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        height: 100dvh;
        text-align: center;
      }
      .boot-inline-spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 4px solid rgba(245, 185, 66, 0.24);
        border-top-color: #f5b942;
        animation: balite-boot-spin 0.85s linear infinite;
      }
      .boot-inline-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #f5b942;
      }
      @keyframes balite-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-loader" role="status" aria-live="polite">
        <div class="boot-inline-spinner" aria-hidden="true"></div>
        <div class="boot-inline-title">BALITE</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
